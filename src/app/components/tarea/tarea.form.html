<p>TAREA FORM COMPONENT</p>

<form novalidate (submit)="this.submitForm($event)">
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" [formField]="this.tareaForm.nombre" />
    <br />

    <label for="descripcion">Descripción</label>
    <input id="descripcion" type="text" [formField]="this.tareaForm.descripcion" />
    <br />

    <input type="submit" value="Guardar">
</form>
<p>{{this.tareaForm().value() | json}}</p>
