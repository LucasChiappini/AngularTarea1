<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Username</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        @for (usuario of usuarios; track usuario.id_usuario) {
        <tr>
            <td>{{ usuario.id_usuario }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.apellido }}</td>
            <td>{{ usuario.username }}</td>
            <td>
                <button>Editar</button>
                <button>Eliminar</button>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="5">No se encontraron usuarios registrados.</td>
        </tr>
        }
    </tbody>
</table>


<div style="margin-top: 20px;">
    <button (click)="goToCrear()">Crear</button>
    <button (click)="irAHome()">Volver al Home</button>
</div>
